# ─────────────────────────────────────────────────────────────────
#  Ambifo CMS — Deployment Variables
#  Edit every value marked with  <-- REQUIRED  before running.
#  Keep this file secret — do NOT commit it to git with real values.
# ─────────────────────────────────────────────────────────────────

# ── Git repository ────────────────────────────────────────────────
git_repo_url: "https://github.com/suraj202923/ambifo-cms.git"
git_branch: "main"

# ── Domain / URL ──────────────────────────────────────────────────
domain_name: "crm.ambifo.com"
app_base_url: "https://crm.ambifo.com"

# ── SSL / Let's Encrypt ───────────────────────────────────────────
# Leave certbot_email blank ("") to skip SSL — useful when using server IP.
certbot_email: "support@ambifo.com"                             # Let's Encrypt SSL for crm.ambifo.com

# ── Admin credentials ─────────────────────────────────────────────
admin_username: "admin"
admin_password: "ChangeMe_Strong_Password_123!"               # <-- REQUIRED  change this

# ── App secret key ────────────────────────────────────────────────
# Generate with:  python3 -c "import secrets; print(secrets.token_hex(32))"
app_secret_key: "REPLACE_WITH_64_CHAR_RANDOM_HEX"             # <-- REQUIRED

# ── PostgreSQL database ───────────────────────────────────────────
db_host: "localhost"
db_port: 5432
db_name: "ambifo_crm"
db_user: "ambifo_user"
db_password: "ChangeMe_DB_Password_456!"                      # <-- REQUIRED  change this
db_sslmode: "prefer"

# ── SMTP / Email ──────────────────────────────────────────────────
# Leave smtp_host blank ("") to use dev-mode (email not sent, but logged).
smtp_host: ""                                                  # e.g. "smtp.gmail.com"
smtp_port: 587
smtp_username: ""                                              # e.g. "alerts@yourdomain.com"
smtp_password: ""
smtp_use_tls: "true"
smtp_mail_from: "noreply@yourdomain.com"
