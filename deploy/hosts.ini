# ─────────────────────────────────────────────────────────────────
#  Ambifo CMS — Ansible Inventory
#  Replace the placeholder values below with your server details.
# ─────────────────────────────────────────────────────────────────

[ambifo_server]
crm-server ansible_host=YOUR_SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your_key.pem

# ── Notes ──────────────────────────────────────────────────────────
# ansible_host         : your Ubuntu server's public IP address
# ansible_user         : SSH login user (ubuntu for AWS, root for DigitalOcean, etc.)
# ansible_ssh_private_key_file : path to your .pem or .ppk private key file
#
# Example for DigitalOcean (root user, password auth):
#   crm-server ansible_host=143.110.X.X ansible_user=root ansible_password=yourpassword
#
# Example for AWS EC2 (ubuntu user, key-based):
#   crm-server ansible_host=52.X.X.X ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/ambifo.pem
