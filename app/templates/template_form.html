{% extends 'base.html' %}
{% block content %}
<section class="panel narrow">
  <h2>Create Email Template</h2>
  <p class="hint">Available macros: {{ '{{customer_name}}' }}, {{ '{{account_name}}' }}, {{ '{{email}}' }}, {{ '{{phone}}' }}, {{ '{{city}}' }}, {{ '{{today}}' }}, {{ '{{gathering_form_link}}' }}</p>
  <form method="post" class="grid-form">
    <label>Template Name<input name="name" required></label>
    <label class="full">Subject Template<input name="subject_template" required></label>
    <label class="full">Body Template (HTML supported)<textarea name="body_template" rows="12" required></textarea></label>
    <button class="btn" type="submit">Save Template</button>
  </form>
</section>
{% endblock %}
