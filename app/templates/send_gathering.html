{% extends 'base.html' %}
{% block content %}
<section class="panel narrow">
  <h2>Send Gathering Request</h2>
  <p class="hint">Send a secure customer form link with expiry and access key. Customer can update only the public gathering form, not your internal system.</p>
  <form method="post" class="grid-form" enctype="multipart/form-data">
    <label>Customer
      <select name="customer_id" required>
        <option value="">Select customer</option>
        {% for c in customers %}
          <option value="{{ c.id }}" {% if selected_customer_id == c.id %}selected{% endif %}>{{ c.customer_name }} ({{ c.email }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Link Expiry (days)
      <input type="number" name="expiry_days" min="1" max="90" value="{{ (form_values.expiry_days if form_values else default_expiry_days) or 7 }}" required>
    </label>
    <label>CC (optional)
      <input name="cc_emails" value="{{ form_values.cc if form_values else '' }}" placeholder="cc1@example.com, cc2@example.com">
    </label>
    <label>BCC (optional)
      <input name="bcc_emails" value="{{ form_values.bcc if form_values else '' }}" placeholder="bcc1@example.com, bcc2@example.com">
    </label>
    <label>Attach Gathering Sheet (optional)<input type="file" name="gathering_sheet"></label>
    <label class="full">Custom Note<textarea name="note" rows="4" placeholder="Any additional instruction for customer">{{ form_values.note if form_values else '' }}</textarea></label>
    <button class="btn mobile-sticky-submit" type="submit">Send Gathering Email</button>
  </form>
</section>
{% endblock %}
