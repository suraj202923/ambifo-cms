{% extends 'base.html' %}
{% block content %}
<section class="panel narrow" style="text-align:center; padding:2rem;">
  <h2>Something went wrong</h2>
  <p class="hint">The server encountered an unexpected error. If this keeps happening, contact support.</p>
  <a class="btn" href="/">Go to Home</a>
</section>
{% if error_detail %}
<section class="panel" style="margin-top:1.5rem;">
  <h3 style="color:#c0392b;">Error Detail (visible to logged-in users only)</h3>
  <pre style="background:#1e1e1e;color:#f8f8f8;padding:1rem;border-radius:6px;overflow-x:auto;font-size:0.82em;text-align:left;">{{ error_detail }}</pre>
</section>
{% endif %}
{% endblock %}
