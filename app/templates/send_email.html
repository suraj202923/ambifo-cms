{% extends 'base.html' %}
{% block content %}
<section class="panel narrow">
  <h2>Send Email with Template</h2>
  <form method="post" class="grid-form">
    <label>Customer
      <select name="customer_id" required>
        <option value="">Select customer</option>
        {% for c in customers %}
          <option value="{{ c.id }}" {% if selected_customer_id == c.id %}selected{% endif %}>{{ c.customer_name }} ({{ c.email }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Template
      <select name="template_id" required>
        <option value="">Select template</option>
        {% for t in templates %}
          <option value="{{ t.id }}">{{ t.name }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn mobile-sticky-submit" type="submit">Send Email</button>
  </form>
</section>
{% endblock %}
