databases:
  - name: ambifo-cms-db
    plan: free
    databaseName: ambifo_crm
    user: ambifo_crm_user

services:
  - type: web
    name: ambifo-cms
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: ambifo-cms-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: TEAMS_TENANT_ID
        sync: false
      - key: TEAMS_CLIENT_ID
        sync: false
      - key: TEAMS_CLIENT_SECRET
        sync: false
      - key: TEAMS_ORGANIZER_ID
        sync: false
      - key: TEAMS_DEFAULT_DURATION_MINUTES
        value: "60"
